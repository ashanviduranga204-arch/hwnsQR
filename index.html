<script>
/* Firebase adapter: gives the app the same small database interface it used on claude.ai */
firebase.initializeApp(FIREBASE_CONFIG);
const fa=firebase.auth(),fs=firebase.firestore();
const sn=s=>({id:s.id,exists:s.exists,data:()=>s.data()}),qs=s=>({docs:s.docs.map(sn)});
const DBX={doc:p=>({set:d=>fs.doc(p).set(d),get:async()=>sn(await fs.doc(p).get()),delete:()=>fs.doc(p).delete(),onSnapshot:(cb,er)=>fs.doc(p).onSnapshot(s=>cb(sn(s)),er)}),
 collection:c=>({get:async()=>qs(await fs.collection(c).get()),onSnapshot:(cb,er)=>fs.collection(c).onSnapshot(s=>cb(qs(s)),er)})};
window.claude={use:async n=>{if(n!=="db")return null;await new Promise(r=>{const u=fa.onAuthStateChanged(x=>{if(x){u();r()}else fa.signInAnonymously().catch(()=>r())})});return DBX}};
</script>

 const c={ok:0,vac:0,del:0};S.R.forEach(r=>{const s=st(r);s==="ok"?c.ok++:s==="vac"?c.vac++:s!=="idle"&&c.del++});
 paintP();relBanner();paintMe();$("k0").textContent=S.R.length;$("k1").textContent=c.ok;$("k2").textContent=c.vac;$("k3").textContent=c.del;
 const f=$("gf").value||"ALL",ic={IN:"✅",OUT:"🚪",AUTO:"🔄",RELIEF:"🔁",ALERT:"⚠️"},kc={IN:"ok",OUT:"wa",AUTO:"wa",RELIEF:"bl",ALERT:"bad"};

 $("feed").innerHTML=S.logs.slice(0,12).map(l=>`<div class="fi" style="border-color:var(--${kc[l.act]})"><div class="text-xs"><b>${ic[l.act]} ${l.room}</b> — ${t(l.act)}</div><div class="text-[11px] mu">${l.teacher!=="—"?l.teacher+" · ":""}${hm(l.t)}</div></div>`).join("");
 const LG=hv?HL:S.logs;$("hdt").textContent=hv||dk();$("hbn").classList.toggle("hidden",!hv);$("he").classList.toggle("hidden",LG.length>0);$("log").innerHTML=LG.slice(0,600).map(l=>`<tr><td>${hm(l.t)}</td><td>${l.p||"—"}</td><td><b>${l.room}</b></td><td>${l.teacher}</td><td>${l.teacher==="—"?"—":sj(l.teacher)}</td><td><span class="bd" style="background:var(--${kc[l.act]});color:${kc[l.act]==="wa"?"#111":"#fff"}">${t(l.act)}</span></td></tr>`).join("");
 fill("dr",t("selRoom"),S.R.filter(r=>!r.teacher).map(r=>[r.id,inP()?r.id+" · "+mins(r)+" "+t("min"):r.id]));
 fill("df",t("selFree"),TE.filter(e=>!S.R.some(r=>r.teacher===e.n)).map(e=>[e.n,e.n+" ("+t("free")+")"]));
 fill("ts",t("selT"),TE.map(e=>[e.n,e.n]));if($("df").value!==phFor)loadPh();

let bdone=0;function tab(v){if((v==="dash"||v==="qr")&&!UNL)return openLock(v);if(v==="qr"&&!bdone){bdone=1;badges()}["dash","scan","qr"].forEach(x=>{$("v-"+x).classList.toggle("hidden",x!==v);$("t-"+x).classList.toggle("on",x===v)});if(v!=="scan")stopCam();else startCam(1)}
function startCam(auto){if(qr)return;
 try{const h=new Html5Qrcode("qr-reader");qr=h;const cfg={fps:10,qrbox:220};
  const ok=x=>{if(Date.now()-last>3000){last=Date.now();scan(x.replace(/^(RNC|HWNS)\|/,""))}};
  const on=()=>{$("ph").classList.add("hidden");$("b1").classList.add("hidden");$("b2").classList.remove("hidden")};
  const fail=()=>{qr=null;if(!auto)toast(t("tCam"),"bad")};
  /* phone: rear camera -> laptop: front/webcam -> any available camera */
  h.start({facingMode:"environment"},cfg,ok,()=>{}).then(on).catch(()=>
   h.start({facingMode:"user"},cfg,ok,()=>{}).then(on).catch(()=>
    Html5Qrcode.getCameras().then(c=>{if(!c||!c.length)throw 0;return h.start(c[0].id,cfg,ok,()=>{})}).then(on).catch(fail)))
 }catch(e){qr=null;if(!auto)toast(t("tCam"),"bad")}}
function stopCam(){const q=qr;qr=null;$("ph").classList.remove("hidden");$("b1").classList.remove("hidden");$("b2").classList.add("hidden");if(q)q.stop().then(()=>q.clear()).catch(()=>{})}
